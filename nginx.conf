  GNU nano 7.2                                         /etc/nginx/sites-available/brahmadzen *                                                 
# Редирект на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name brahmadzen.space www.brahmadzen.space;
    return 301 https://$host$request_uri;
}

# Основной сервер HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brahmadzen.space www.brahmadzen.space;

    client_max_body_size 10000M;

    # SSL пути
    ssl_certificate /etc/letsencrypt/live/brahmadzen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brahmadzen.space/privkey.pem;

    # Твой билд
    root /home/dzen/app/client/build;
    index index.html;

    # Проксирование к API
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Проксирование к /roms/ (твоя фишка)
    location /roms/ {
        rewrite ^/roms/?(.*)$ /$1 break;
        proxy_pass http://localhost:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Проксирование к /emulator/
    location /emulator/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Статика React
    location / {
        try_files $uri $uri/ /index.html;
    } 
}
