name: Frontend CI

# 1. Когда запускать? При каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Используем свежий Linux

    steps:
      # 2. "Выкачиваем" код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ставь ту версию, на которой работаешь локально
          cache: 'npm'       # Ускоряет установку, кэшируя зависимости

      # 4. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci          # Аналог npm install, но строже и быстрее для CI

      # 5. Проверяем типы (если у тебя TS)
      - name: TypeScript check
        run: npx tsc --noEmit

      # 6. Запускаем сборку
      - name: Build project
        run: npm run build