name: Frontend CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./client  # <--- ВАЖНО: заходим в папку фронта
        run: npm install

      - name: Build project
        working-directory: ./client  # <--- ВАЖНО: и тут тоже
        run: npm run build