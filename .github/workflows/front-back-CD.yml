name: Deploy Static Front + Docker Back

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Сборка фронтенда (создаем статику)
      - name: Build Frontend
        run: |
          cd client
          npm install
          npm run build

      # 2. Копирование файлов на сервер
      - name: Copy Project Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          use_insecure_cipher: true
          # Копируем всё: и готовую папку client/build, и файлы для докера
          source: "./*"
          target: "/home/dzen/app"
          strip_components: 0

      # 3. Управление Docker (Бэкенд + БД)
      - name: Run Docker Services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_config: |
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          script: |
            cd /home/dzen/app
            # Поднимаем только бэкенд и базу
            docker-compose up -d --build postgres backend emulator romserv
            # Чистим старые образы, чтобы не забивать диск
            docker image prune -f