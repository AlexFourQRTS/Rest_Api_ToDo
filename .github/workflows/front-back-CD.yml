name: Fast Git Pull Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_config: |
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          script: |
            cd app
            git fetch --all
            git reset --hard origin/main
            git pull
            cd client && npm install && npm run build && cd ..
            
            # Используем новую команду docker compose (без тире)
            # Если не сработает, оставь с тире, но обнови права (см. пункт 1)
            docker compose up -d --build postgres backend emulator romserv