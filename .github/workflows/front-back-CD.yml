name: Fast Git Pull Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_config: |
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          script: |
            cd /home/dzen/app
            
            # 1. Затягиваем изменения из GitHub
            git pull origin main
            
            # 2. Собираем фронтенд прямо на мощном сервере
            cd client
            npm install
            npm run build
            cd ..
            
            # 3. Поднимаем Docker (бэк, база и остальное)
            # --build заставит докер пересобрать бэк, если код изменился
            docker-compose up -d --build postgres backend emulator romserv
            
            # 4. Чистим мусор
            docker image prune -f