name: CD - Continuous Deployment  

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_config: |
            HostKeyAlgorithms +ssh-rsa
            PubkeyAcceptedAlgorithms +ssh-rsa
          script: |
            cd /home/dzen
            
            # 2. Проверяем, существует ли папка и репозиторий
            if [ ! -d "app/.git" ]; then
              echo "Папка пуста или репозитория нет. Клонирую..."
              rm -rf app
              git clone https://github.com/AlexFourQRTS/Rest_Api_ToDo.git app
            fi
            cd app
            git fetch --all
            git reset --hard origin/main
            
            docker compose down
            docker compose up --build -d
            
            cd ./RomServ
            npm install
            
            pm2 restart romserv || pm2 start npm --name "romserv" -- run dev
            
            docker system prune -f
            cd ..
            cd client
            npm install
            npm run build
