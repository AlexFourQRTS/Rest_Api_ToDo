# HTTP -> HTTPS redirect and ACME challenge
server {
    listen 80;
    server_name skydishch.fun;

    client_max_body_size 10000M;

    # ACME HTTP-01 challenge (certbot webroot on host)
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
        add_header Content-Type text/plain;
        access_log off;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name skydishch.fun;

    client_max_body_size 10000M;

    # SSL certificates (mounted from host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/skydishch.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skydishch.fun/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/skydishch.fun/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Статика React
    root /usr/share/nginx/html;
    index index.html;

    # ACME HTTP-01 challenge (на всякий случай и по HTTPS)
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
        add_header Content-Type text/plain;
        access_log off;
    }

    location / {
        try_files $uri /index.html;
    }

    # Прокси на NestJS backend
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Прокси на RomServ (укороченные пути)
    location /roms/ {
        rewrite ^/roms/?(.*)$ /$1 break;
        proxy_pass http://romserv:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси на EmulatorServ
    location /emulator/ {
        proxy_pass http://emulator:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
} 