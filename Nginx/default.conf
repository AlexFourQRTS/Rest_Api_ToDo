# HTTP server (редирект на HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name brahmadzen.space www.brahmadzen.space;

    client_max_body_size 10000M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brahmadzen.space www.brahmadzen.space;

    client_max_body_size 10000M;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/brahmadzen.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brahmadzen.space/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/brahmadzen.space/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Корневая директория для статических файлов
    root /home/zmxncbv/www/Rest_Api_ToDo/client/build;
    index index.html;

    # Обработка ошибок для случаев, когда бэкенд недоступен
    error_page 502 503 504 /error.html;
    location = /error.html {
        root /home/zmxncbv/www/Rest_Api_ToDo/client/build;
        internal;
    }

    # Проксирование к API
    location /api/ {
        proxy_pass http://localhost:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    # Проксирование к /roms/
    location /roms/ {
        rewrite ^/roms/?(.*)$ /$1 break;
        proxy_pass http://localhost:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование к /emulator/
    location /emulator/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Кэширование статических файлов
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin *;
    }

    # Обработка SPA (React)
    location / {
        try_files $uri /index.html;
    }

    # Отключение логов для favicon и robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Логирование
    error_log /var/log/nginx/skydishch_error.log;
    access_log /var/log/nginx/skydishch_access.log;
}