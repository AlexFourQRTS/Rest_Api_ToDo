version: '3.8'

services:
  frontend-builder:
    image: node:18-alpine
    container_name: frontend-builder
    volumes:
      - ./client:/app
    working_dir: /app
    command: >
      sh -c "npm install && npm run build"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      # билд фронта будет доступен nginx
      - ./client/build:/usr/share/nginx/html:ro
      # если есть свой конфиг nginx
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend-builder
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: Database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xsanderadmin
      POSTGRES_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./NestJS
    container_name: backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: xsanderadmin
      DB_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      DB_DATABASE: postgres
      JWT_SECRET: your_super_secret_key
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./NestJS/uploads:/app/uploads
      - ./NestJS/storage:/app/storage
      - ./NestJS/CloudFile:/app/CloudFile
  
  romserv:
    build: ./RomServ
    container_name: romserv
    ports:
      - "9999:9999"
    volumes:
      - ./RomServ/Games:/app/Games
    networks:
      - app-network
    depends_on:
      - backend

  emulator:
    build: ./EmulatorServ
    container_name: emulator
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - romserv
  
networks:
  app-network:
    driver: bridge
