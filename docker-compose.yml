version: '3.8'

services:

  frontend-builder:
    image: node:18
    container_name: frontend-builder
    volumes:
      - ./client:/app
    working_dir: /app
    command: >
      /bin/bash -c "npm install && npm run build"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/build:/usr/share/nginx/html
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks:
      - app-network
    depends_on:
      - frontend-builder
    command: ["nginx", "-g", "daemon off;"]

  postgres:
    image: postgres:15
    container_name: Database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xsanderadmin
      POSTGRES_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network
    depends_on:
      - nginx

  backend:
    build: ./NestJS
    container_name: backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: xsanderadmin
      DB_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      DB_DATABASE: postgres
      JWT_SECRET: your_super_secret_key
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./NestJS/uploads:/app/uploads
      - ./NestJS/storage:/app/storage
      - ./NestJS/CloudFile:/app/CloudFile
  
  romserv:
    build: ./RomServ
    container_name: romserv
    ports:
      - "9999:9999"
    volumes:
      - ./RomServ/Games:/app/Games
    networks:
      - app-network
    depends_on:
      - backend

  emulator:
    build: ./EmulatorServ
    container_name: emulator
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - romserv

volumes:
  certbot-webroot:
  certbot-certs:

networks:
  app-network:
    driver: bridge
