version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: Database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: xsanderadmin
      POSTGRES_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./NestJS
    container_name: backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: xsanderadmin
      DB_PASSWORD: qweasdrtyfghvbnjklyuiospgmrj
      DB_DATABASE: postgres
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./NestJS/uploads:/app/uploads
      - ./NestJS/storage:/app/storage
      - ./NestJS/CloudFile:/app/CloudFile

  emulator:
    build: ./EmulatorServ
    container_name: emulator
    ports:
      - "8080:8080"
    networks:
      - app-network

  romserv:
    build: ./RomServ
    container_name: romserv
    ports:
      - "9999:9999"
    volumes:
      - ./RomServ/Games:/app/Games
    networks:
      - app-network
      
  frontend-builder:
    image: node:18
    container_name: frontend-builder
    volumes:
      - ./Rest_Api_ToDo/client:/app
    working_dir: /app
    command: >
      /bin/bash -c "npm install && npm run build"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Rest_Api_ToDo/client/build:/usr/share/nginx/html
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    networks:
      - app-network
    depends_on:
      - backend
      - emulator
      - romserv
      - frontend-builder
    command: "/bin/bash -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    command: >
      certonly --webroot -w /var/www/certbot 
      --email xvergox@gmail.com --agree-tos 
      --no-eff-email -d skydishch.fun
    networks:
      - app-network

volumes:
  certbot-webroot:
  certbot-certs:

networks:
  app-network:
    driver: bridge
