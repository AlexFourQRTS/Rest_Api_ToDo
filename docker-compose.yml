version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: Database
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}" 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: ./NestJS
    container_name: backend
    environment:
     
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}" 
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./NestJS/uploads:/app/uploads
      - ./NestJS/storage:/app/storage
      - ./NestJS/CloudFile:/app/CloudFile

  emulator:
    build: ./EmulatorServ
    container_name: emulator
    ports:
      - "${EMULATOR_PORT}:${EMULATOR_PORT}" 
    networks:
      - app-network

  romserv:
    build: ./RomServ
    container_name: romserv
    ports:
      - "${ROMSERV_PORT}:${ROMSERV_PORT}" 
    volumes:
      - ./RomServ/Games:/app/Games
    networks:
      - app-network


networks:
  app-network:
    driver: bridge